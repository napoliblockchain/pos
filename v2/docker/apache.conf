ServerName pos.localhost
<VirtualHost *:80>
    DocumentRoot /srv/pos/web
    SetEnv HTTPS on
    DirectoryIndex index.php
    <Directory /srv/pos/web>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    LogFormat "%h %t \"%m %U %H\" %>s %b" pos_private
    CustomLog /proc/self/fd/1 pos_private
    ErrorLog /proc/self/fd/2
</VirtualHost>
